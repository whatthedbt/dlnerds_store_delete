version: 2

models:
  - name: product_cleaned
    description: ""
    columns:
      - name: id
        data_type: varchar
        description: ""

      - name: name
        data_type: varchar
        description: ""

      - name: code
        data_type: varchar
        description: ""

      - name: category
        data_type: varchar
        description: ""
        tests:
          - accepted_values:
              arguments:
                values: ["T-Shirt", "Hoodie", "Short", "Socks", "Jacket", "Accessories"]
              config: # This changes it from a Failure to a Warning
                severity: warn

      - name: price
        data_type: float
        description: ""

      - name: currency
        data_type: varchar
        description: ""

      - name: color
        data_type: varchar
        description: ""

      - name: created_at
        data_type: timestamp_ntz
        description: ""

      - name: updated_at
        data_type: timestamp_ntz
        description: ""